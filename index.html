<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Cpath d='M5 21l6-6 5 4 10-11' fill='none' stroke='%230ca30c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242423; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --neutral:#383835;
  --up:#0ca30c; --up-ink:#35c435; --down:#d03b3b; --down-ink:#f07a7a; --warn:#fab219; --warn-ink:#fab219;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#3987e5;
  --shadow:0 12px 40px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f9f9f7; --surface:#fcfcfb; --surface2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --neutral:#e6e5df;
    --up:#0ca30c; --up-ink:#006300; --down:#d03b3b; --down-ink:#b42a2a; --warn:#fab219; --warn-ink:#7a5200;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --accent:#2a78d6;
    --shadow:0 12px 40px rgba(0,0,0,.18);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.up{color:var(--up-ink)} .down{color:var(--down-ink)} .flat{color:var(--ink2)}
.d{font-variant-numeric:tabular-nums;white-space:nowrap}
.d i{font-style:normal;font-size:.72em;margin-right:.18em;position:relative;top:-.08em}
.muted{color:var(--muted)}
svg.sp{display:block;overflow:visible}
svg.sp polyline{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
svg.sp.up polyline{stroke:var(--up)} svg.sp.down polyline{stroke:var(--down)}
svg.sp .sp-base{stroke:var(--axis);stroke-width:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:24px;min-width:24px;padding:0 6px;border-radius:6px;color:var(--ink2);border:1px solid var(--border);background:var(--surface)}
.icon-btn:hover{color:var(--ink);background:var(--surface2)}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink2)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.open .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.status.pre .dot,.status.post .dot,.status.demo .dot{background:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:var(--ink2);white-space:nowrap}
.badge.live b{color:var(--up-ink)} .badge.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn-ink)}
.badge.demo{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--warn) 14%,transparent) 6px 12px)}

/* ───────── compact ticker ───────── */
#ticker{display:none;flex-direction:column;height:100vh;overflow:hidden;background:var(--surface)}
.mode-ticker{overflow:hidden}
.mode-ticker #ticker{display:flex}
.t-head{display:flex;align-items:center;gap:12px;height:30px;flex:none;padding:0 6px 0 10px;border-bottom:1px solid var(--grid);font-size:12px;white-space:nowrap;overflow:hidden}
.t-idx{display:flex;gap:14px;flex:1;min-width:0;overflow:hidden}
.t-idx span.n{color:var(--muted);margin-right:5px}
.t-idx button{flex:none}
.t-meta{display:flex;gap:8px;align-items:center;color:var(--muted);flex:none}
.tape{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center}
.tape-track{display:flex;flex:none;white-space:nowrap;will-change:transform;animation:tape 120s linear infinite}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:baseline;gap:.42em;padding:.15em .85em;font-size:clamp(15px,calc((100vh - 30px) * .27),30px);border-right:1px solid var(--grid)}
.ti b{font-weight:650;letter-spacing:.01em}
.ti .p{color:var(--ink2);font-variant-numeric:tabular-nums}
.ti .d{font-size:.82em}
.ti:hover{background:var(--surface2)}
.board{display:none}
/* thin bar: one row, tape on the left, controls on the right */
@media (max-height:69px){
  #ticker{flex-direction:row}
  .t-head{order:2;height:auto;gap:6px;padding:0 3px 0 6px;border-bottom:0;border-left:1px solid var(--grid)}
  #t-status,.t-idx{display:none}
  .ti{font-size:clamp(13px,50vh,24px);padding:0 .85em}
  .t-head .icon-btn{height:min(24px,calc(100vh - 6px));min-width:min(24px,calc(100vh - 6px))}
}
/* window controls, shown only inside the Windows host window (no native title bar there) */
.win{display:none;gap:4px;align-items:center;flex:none}
.in-host .win{display:inline-flex}
.win .icon-btn{padding:0 5px}
.win .x:hover{background:var(--down);border-color:var(--down);color:#fff}
.in-host .t-head,.in-host .a-head{user-select:none}
@media (min-height:230px){
  .tape{flex:none;height:58px;border-bottom:1px solid var(--grid)} .ti{font-size:21px}
  .board{display:grid;flex:1;min-height:0;overflow:auto;padding:10px;gap:6px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));align-content:start;background:var(--bg)}
}
@media (max-width:520px){ .t-meta .upd{display:none} }
@media (prefers-reduced-motion:reduce){ .tape{overflow-x:auto} .tape-track{animation:none} .tape-track .dup{display:none} }
.chip{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:7px;text-align:left;background:color-mix(in oklab,var(--heat,var(--neutral)) var(--heat-a,0%),var(--surface2));border:1px solid var(--border);min-width:0}
.chip:hover{border-color:var(--ink2)}
.chip b{font-weight:650;font-size:12.5px}
.chip .p{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chip .d{font-size:12px;color:var(--ink)}

/* ───────── analysis ───────── */
#analysis{display:none;min-height:100vh;padding:12px 18px 26px;max-width:2300px;margin:0 auto}
.mode-analysis #analysis{display:block}
.a-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.a-idx{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.idx{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);text-align:left}
.idx:hover{background:var(--surface2)}
.idx .idx-n{font-size:11px;color:var(--muted);grid-column:1} .idx .idx-v{font-weight:650;font-size:14px;grid-column:1;font-variant-numeric:tabular-nums}
.idx .idx-r{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px}
.a-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.notice{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--ink2);font-size:12px;margin-bottom:10px}
.notice b{color:var(--ink)}
.notice.err{border-color:color-mix(in srgb,var(--down) 55%,transparent);background:color-mix(in srgb,var(--down) 9%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-width:0;text-align:left;display:block}
button.kpi:hover{background:var(--surface2)}
.kpi .k-l{font-size:11.5px;color:var(--muted)} .kpi .k-v{font-size:20px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;height:6px;margin:5px 0 3px} .seg i{display:block;height:100%;border-radius:2px;min-width:2px}
.seg .u{background:var(--up)} .seg .f{background:var(--axis)} .seg .dn{background:var(--down)}
.cols{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr) minmax(0,1.14fr);gap:12px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px 12px;min-width:0}
.card h2{margin:0 0 2px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:11.5px}
.card h2 .sp-r{margin-left:auto;display:flex;gap:4px}
.card .hint{font-size:11.5px;color:var(--muted);margin:0 0 6px}
table{border-collapse:collapse;width:100%}
th{font-weight:500;font-size:11px;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px}
th.l,td.l{text-align:left}
td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface2)}
td .sym{font-weight:650} td .nm{display:block;font-size:11px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid var(--border);color:var(--ink2);white-space:nowrap}
.rb{position:relative;width:54px;height:6px;border-radius:3px;background:var(--neutral);display:inline-block;vertical-align:middle}
.rb i{position:absolute;top:-2px;width:4px;height:10px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface);transform:translateX(-50%)}
.lean{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap;color:var(--ink2)}
.lean i{font-style:normal;font-size:9px}
.lean.up i{color:var(--up-ink)} .lean.down i{color:var(--down-ink)} .lean.flat i{color:var(--muted)}
.tgl{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.tgl button{padding:1px 8px;font-size:11.5px;color:var(--ink2)} .tgl button+button{border-left:1px solid var(--border)}
.tgl button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);font-weight:600}
/* sector rows */
.srow{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(70px,1fr) 56px 40px 64px;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--grid);width:100%;text-align:left;cursor:default}
.srow:last-child{border-bottom:0}
.srow .s-n{min-width:0} .srow .s-n b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s-n span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{position:relative;height:16px}
.dbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.dbar i{position:absolute;top:2px;height:12px;min-width:2px}
.dbar i.u{left:50%;background:var(--up);border-radius:0 4px 4px 0} .dbar i.dn{right:50%;background:var(--down);border-radius:4px 0 0 4px}
.s-head{font-size:11px;color:var(--muted);padding-bottom:3px;border-bottom:1px solid var(--grid)}
.srow.s-head{padding-top:0}
/* predictions */
.pred-card{display:flex;flex-direction:column;flex:1}
.pred-list{flex:1 1 0;height:0;min-height:420px;overflow:auto;margin:0 -6px;padding:0 6px}
.pred{border-top:1px solid var(--grid);padding:10px 0 11px}
.pred:first-child{border-top:0;padding-top:4px}
.pred-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer}
.pred-h .sym{font-weight:700;font-size:14px} .pred-h .nm{color:var(--muted);font-size:11.5px}
.pred-h .mv{margin-left:auto}
.call{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 0 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-weight:650;font-size:12px;border:1px solid var(--border);background:var(--surface2)}
.pill.up{border-color:color-mix(in srgb,var(--up) 60%,transparent)} .pill.down{border-color:color-mix(in srgb,var(--down) 60%,transparent)}
.pill i{font-style:normal;font-size:9px}
.call .meta{font-size:11.5px;color:var(--ink2)}
.spec{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:4px;padding:0 5px}
.args{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.args h3{margin:0 0 2px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.args ul{margin:0;padding:0 0 0 15px} .args li{margin:0 0 4px;color:var(--ink2);font-size:12px;line-height:1.38}
.args .con li::marker{color:var(--warn-ink)}
.flip{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.flip b{color:var(--ink2);font-weight:600}
/* heat board + full table */
.sect{margin-top:12px}
/* sector outlook */
.ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 22px;margin-top:6px}
.ol-h{min-width:0;padding-left:22px;border-left:1px solid var(--grid)} .ol-h:first-child{padding-left:0;border-left:0}
.ol-h>h3{margin:0 0 6px;font-size:13px;font-weight:650} .ol-h>h3 span{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.ol h4{margin:10px 0 3px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ol h4 i{font-style:normal;font-size:9px;margin-right:5px}
.pick{padding:5px 0 6px;border-top:1px solid var(--grid)}
.pick button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left}
.pick button:hover .pk-n{text-decoration:underline}
.pick .pk-n{font-weight:650} .pick .pk-n i{font-style:normal;font-size:9px;margin-right:6px;position:relative;top:-1px}
.pick .pk-o{margin-left:auto;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick p{margin:2px 0 0;font-size:12px;line-height:1.38;color:var(--ink2)} .pick p b{font-weight:600;color:var(--ink)}
.pick p.but b{color:var(--warn-ink)}
.ol-none{font-size:12px;color:var(--muted);padding:5px 0;border-top:1px solid var(--grid);margin:0}
.ol-rank{display:grid;grid-template-columns:minmax(96px,1fr) minmax(60px,1.2fr) 44px;gap:2px 8px;align-items:center;font-size:11.5px;color:var(--ink2)}
.ol-rank .dbar{height:12px} .ol-rank .dbar i{top:2px;height:8px}
.ol-rank span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-cav{margin:0;padding:0 0 0 15px} .ol-cav li{font-size:12px;line-height:1.38;color:var(--ink2);margin-bottom:4px} .ol-cav li::marker{color:var(--warn-ink)}
@media (max-width:1100px){ .ol{grid-template-columns:1fr} .ol-h{padding-left:0;border-left:0;margin-top:14px} .ol-h:first-child{margin-top:0} }
/* prediction scorecard */
.sc-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px 28px;margin-top:12px}
.sc-grid h3,.sc-h{margin:0 0 2px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sc-t td{font-size:12px} .sc-t tbody tr{cursor:default} .sc-t tbody tr:hover{background:none}
.sc-t tr.all td{font-weight:650}
.sc-t .mb{position:relative;width:84px;height:8px;background:var(--neutral);border-radius:4px;display:inline-block;vertical-align:middle}
.sc-t .mb::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.sc-t .mb i{position:absolute;top:0;height:8px;min-width:2px} .sc-t .mb i.u{left:50%;background:var(--up);border-radius:0 4px 4px 0} .sc-t .mb i.dn{right:50%;background:var(--down);border-radius:4px 0 0 4px}
#sc-stats small{font-weight:400;font-size:11.5px;color:var(--muted)}
.sc-wait{font-size:12px;color:var(--ink2);margin:8px 0 0}
.sc-h{margin-top:12px}
.track{margin:0 0 6px;font-size:11.5px;color:var(--ink2)} .track a{color:inherit}
@media (max-width:900px){ .sc-grid{grid-template-columns:1fr} }
.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 16px}
.heat .hg h3{margin:0 0 5px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:baseline} .heat .hg h3 span{font-weight:400;font-size:11.5px}
.heat .hc{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px}
.heat .chip{padding:4px 6px} .heat .chip b{font-size:12px} .heat .chip .d{font-size:11.5px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend .ramp{display:flex;gap:2px} .legend .ramp i{width:16px;height:8px;border-radius:2px;display:block}
.tablewrap{overflow:auto;max-height:560px}
.full th{position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;z-index:1}
.full th:hover{color:var(--ink)} .full th.on{color:var(--ink);font-weight:650}
.foot{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}
@media (max-width:1680px){ .c52{display:none} }
@media (max-width:1440px){ .c5{display:none} }
@media (max-width:1180px){ .cols{grid-template-columns:1fr 1fr} .col.c3{grid-column:1/-1} .pred-list{height:auto;max-height:70vh;flex:none} }
@media (max-width:780px){ .cols{grid-template-columns:1fr} .args{grid-template-columns:1fr} #analysis{padding:10px} }
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(1120px,100%);padding:16px 18px 18px}
.m-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.m-head h2{margin:0;font-size:20px} .m-head .nm{color:var(--ink2)} .m-head .px{font-size:20px;font-weight:650;margin-left:auto;font-variant-numeric:tabular-nums}
.m-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:10px}
@media (max-width:860px){ .m-grid{grid-template-columns:1fr} }
.chart{position:relative}
.chart svg{display:block;width:100%}
.chart .gl{stroke:var(--grid);stroke-width:1} .chart .ax{fill:var(--muted);font-size:10.5px}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .l1{stroke:var(--s1)} .chart .l2{stroke:var(--s2)} .chart .l3{stroke:var(--s3)}
.chart .area{fill:var(--s1);opacity:.1}
.chart .ch{stroke:var(--axis);stroke-width:1}
.chart .dot{stroke:var(--surface);stroke-width:2}
.lg{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin:2px 0 4px;flex-wrap:wrap}
.lg i{display:inline-block;width:14px;height:2px;border-radius:1px;vertical-align:middle;margin-right:5px}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Ticker — a lightweight US market watcher.
   One window, two forms: a compact ticker and a full-screen analysis view.
   Edit the watchlist below to change what is tracked.
   ════════════════════════════════════════════════════════════════════ */

const SECTORS = [
  {id:'tech', name:'Technology',             short:'Tech',        etf:'XLK',  style:'cyclical'},
  {id:'comm', name:'Communication Services', short:'Comm',        etf:'XLC',  style:'cyclical'},
  {id:'disc', name:'Consumer Discretionary', short:'Cons. Disc.', etf:'XLY',  style:'cyclical'},
  {id:'fin',  name:'Financials',             short:'Financials',  etf:'XLF',  style:'cyclical'},
  {id:'ind',  name:'Industrials',            short:'Industrials', etf:'XLI',  style:'cyclical'},
  {id:'mat',  name:'Materials',              short:'Materials',   etf:'XLB',  style:'cyclical'},
  {id:'ener', name:'Energy',                 short:'Energy',      etf:'XLE',  style:'cyclical'},
  {id:'hlth', name:'Health Care',            short:'Health',      etf:'XLV',  style:'defensive'},
  {id:'stap', name:'Consumer Staples',       short:'Staples',     etf:'XLP',  style:'defensive'},
  {id:'util', name:'Utilities',              short:'Utilities',   etf:'XLU',  style:'defensive'},
  {id:'re',   name:'Real Estate',            short:'Real Estate', etf:'XLRE', style:'defensive'},
];
// sector: SYMBOL Name | SYMBOL Name | ...
const WATCHLIST = `
tech: AAPL Apple | MSFT Microsoft | NVDA NVIDIA | AVGO Broadcom | ORCL Oracle | CRM Salesforce | AMD AMD | ADBE Adobe | CSCO Cisco | INTC Intel | IBM IBM | QCOM Qualcomm | TXN Texas Instruments | PLTR Palantir
comm: GOOGL Alphabet | META Meta Platforms | NFLX Netflix | DIS Walt Disney | T AT&T | VZ Verizon | CMCSA Comcast | TMUS T-Mobile US
disc: AMZN Amazon | TSLA Tesla | HD Home Depot | MCD McDonald's | NKE Nike | SBUX Starbucks | LOW Lowe's | BKNG Booking Holdings
fin:  BRK-B Berkshire Hathaway | JPM JPMorgan Chase | V Visa | MA Mastercard | BAC Bank of America | WFC Wells Fargo | GS Goldman Sachs | MS Morgan Stanley
ind:  GE GE Aerospace | CAT Caterpillar | BA Boeing | UNP Union Pacific | HON Honeywell | RTX RTX | UPS UPS
mat:  LIN Linde | SHW Sherwin-Williams | FCX Freeport-McMoRan
ener: XOM Exxon Mobil | CVX Chevron | COP ConocoPhillips
hlth: LLY Eli Lilly | UNH UnitedHealth | JNJ Johnson & Johnson | MRK Merck | ABBV AbbVie | PFE Pfizer | TMO Thermo Fisher | ABT Abbott
stap: WMT Walmart | PG Procter & Gamble | KO Coca-Cola | PEP PepsiCo | COST Costco | PM Philip Morris
util: NEE NextEra Energy | SO Southern Company | DUK Duke Energy
re:   PLD Prologis | AMT American Tower | EQIX Equinix
`;
const INDICES = [['^GSPC','S&P 500'],['^DJI','Dow 30'],['^IXIC','Nasdaq'],['^RUT','Russell 2000'],['^VIX','VIX']];

const SECTOR_BY_ID = Object.fromEntries(SECTORS.map(s => [s.id, s]));
const UNIVERSE = [];
WATCHLIST.trim().split('\n').forEach(line => {
  const i = line.indexOf(':'); const sector = SECTOR_BY_ID[line.slice(0, i).trim()];
  line.slice(i + 1).split('|').forEach(item => {
    const t = item.trim(); if (!t || !sector) return;
    const sp = t.indexOf(' ');
    UNIVERSE.push({sym: sp < 0 ? t : t.slice(0, sp), name: sp < 0 ? t : t.slice(sp + 1).trim(), sector});
  });
});
const INFO = {};
UNIVERSE.forEach(u => INFO[u.sym] = {name:u.name, sector:u.sector, kind:'stock'});
SECTORS.forEach(s => INFO[s.etf] = {name:s.name + ' sector ETF', sector:s, kind:'etf'});
INDICES.forEach(([sym, name]) => INFO[sym] = {name, sector:null, kind:'index'});
const ALL_SYMBOLS = [...INDICES.map(i => i[0]), ...SECTORS.map(s => s.etf), ...UNIVERSE.map(u => u.sym)];
const LONG_SYMBOLS = ['^GSPC', ...SECTORS.map(s => s.etf)];   // two years of weekly closes, for the long-term sector outlook

const PARAMS = new URLSearchParams(location.search);
const API = PARAMS.get('api') || 'api';
const FORCE_DEMO = PARAMS.has('demo');
const CACHE_KEY = 'ticker-cache-v1';
const SCORE_KEY = 'ticker-score-v1';

const S = {
  quotes:{}, daily:{}, weekly:{}, stats:{}, pred:{}, market:null, outlook:null,
  source:'none',            // live | cache | demo
  updated:0, lastError:'', cacheTime:0,
  force:null, selected:null, sectorRange:'chg', sort:{key:'chg', dir:-1},
  dailyAt:0, loading:false, timer:null,
  score:{v:1, open:{}, days:[]}, scoreAsk:0,
};

/* ───────── helpers ───────── */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ok = x => x != null && isFinite(x);
const fmtP = p => !ok(p) ? '–' : p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPct = (x, d) => !ok(x) ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(d == null ? 2 : d) + '%';
const fmtVol = v => !ok(v) ? '–' : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(0) + 'K' : String(v);
const dirOf = x => !ok(x) ? 'flat' : x > 0.00005 ? 'up' : x < -0.00005 ? 'down' : 'flat';
const ARW = {up:'▲', down:'▼', flat:'■'};
const delta = (x, d) => { const k = dirOf(x); return `<span class="d ${k}"><i>${ARW[k]}</i>${ok(x) ? Math.abs(x * 100).toFixed(d == null ? 2 : d) + '%' : '–'}</span>`; };
const pctSpan = (x, d) => `<span class="${dirOf(x)}">${fmtPct(x, d)}</span>`;
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const stdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
const median = a => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const sma = (a, n) => a.length >= n ? mean(a.slice(-n)) : null;
const timeFmt = ts => new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

function rsi14(series) {
  const n = 14; if (series.length < n + 1) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const ch = series[i] - series[i - 1]; if (ch > 0) g += ch; else l -= ch; }
  g /= n; l /= n;
  for (let i = n + 1; i < series.length; i++) { const ch = series[i] - series[i - 1]; g = (g * (n - 1) + Math.max(ch, 0)) / n; l = (l * (n - 1) + Math.max(-ch, 0)) / n; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function spark(c, prev, w, h) {
  w = w || 84; h = h || 24;
  if (!c || c.length < 2) return `<svg class="sp" width="${w}" height="${h}" aria-hidden="true"></svg>`;
  let lo = Math.min.apply(null, c), hi = Math.max.apply(null, c);
  if (ok(prev)) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => (i / (c.length - 1)) * (w - 2) + 1, y = v => h - 2 - ((v - lo) / (hi - lo)) * (h - 4);
  const pts = c.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const up = c[c.length - 1] >= (ok(prev) ? prev : c[0]);
  return `<svg class="sp ${up ? 'up' : 'down'}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${ok(prev) ? `<line class="sp-base" x1="0" x2="${w}" y1="${y(prev).toFixed(1)}" y2="${y(prev).toFixed(1)}"/>` : ''}<polyline points="${pts}"/></svg>`;
}
// background tint for heat chips: green/red by size of move, neutral near zero (the signed number is always printed too)
function heatStyle(x, full) {
  if (!ok(x)) return '';
  const a = Math.round(clamp(Math.abs(x) / (full || 0.03), 0, 1) * 62);
  return `--heat:var(--${x >= 0 ? 'up' : 'down'});--heat-a:${a}%`;
}

/* ───────── data: Yahoo Finance "spark" via the local proxy ───────── */
function parseSpark(json) {
  const out = [], res = json && json.spark && json.spark.result;
  if (!Array.isArray(res)) return out;
  for (const r of res) {
    const resp = r && r.response && r.response[0];
    if (!resp || !resp.meta) continue;
    const ts = resp.timestamp || [];
    const q = resp.indicators && resp.indicators.quote && resp.indicators.quote[0];
    const cl = (q && q.close) || [];
    const t = [], c = [];
    for (let i = 0; i < ts.length; i++) if (ok(cl[i]) && cl[i] > 0) { t.push(ts[i]); c.push(cl[i]); }
    out.push({symbol: r.symbol || resp.meta.symbol, meta: resp.meta, t, c});
  }
  return out;
}
async function fetchJson(url, ms) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 45000);
  try {
    const r = await fetch(url, {signal: ctl.signal, cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
async function fetchSpark(symbols, range, interval) {
  const batches = [];
  for (let i = 0; i < symbols.length; i += 20) batches.push(symbols.slice(i, i + 20));   // Yahoo caps spark at 20 symbols
  const one = async b => {
    const url = `${API}/spark?symbols=${encodeURIComponent(b.join(','))}&range=${range}&interval=${interval}`;
    try { return parseSpark(await fetchJson(url)); }
    catch (e) { await new Promise(r => setTimeout(r, 600)); return parseSpark(await fetchJson(url)); }   // one retry
  };
  const settled = await Promise.allSettled(batches.map(one));
  const out = []; let err = null;
  settled.forEach(s => { if (s.status === 'fulfilled') out.push.apply(out, s.value); else err = s.reason; });
  if (!out.length) throw err || new Error('No data returned');
  return out;
}
function applyIntraday(list) {
  for (const r of list) {
    const m = r.meta, last = r.c.length ? r.c[r.c.length - 1] : null;
    const price = ok(m.regularMarketPrice) ? m.regularMarketPrice : last;
    if (!ok(price)) continue;
    S.quotes[r.symbol] = {
      price, prev: ok(m.previousClose) ? m.previousClose : m.chartPreviousClose,
      hi: m.regularMarketDayHigh, lo: m.regularMarketDayLow, vol: m.regularMarketVolume,
      hi52: m.fiftyTwoWeekHigh, lo52: m.fiftyTwoWeekLow,
      time: m.regularMarketTime || (r.t.length ? r.t[r.t.length - 1] : Math.floor(Date.now() / 1000)),
      gmt: m.gmtoffset || 0, period: m.currentTradingPeriod || null, t: r.t, c: r.c,
    };
  }
}
function applyDaily(list) { for (const r of list) if (r.c.length) S.daily[r.symbol] = {t: r.t, c: r.c}; }
function applyWeekly(list) { S.weekly = {}; for (const r of list) if (r.c.length) S.weekly[r.symbol] = {t: r.t, c: r.c}; }

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({at: S.updated, quotes: S.quotes, daily: S.daily, weekly: S.weekly})); } catch (e) { /* storage full or blocked */ }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (!c || !c.quotes || !Object.keys(c.quotes).length) return false;
    S.quotes = c.quotes; S.daily = c.daily || {}; S.weekly = c.weekly || {}; S.cacheTime = c.at || 0; return true;
  } catch (e) { return false; }
}

/* ───────── demo data (clearly labelled simulation, used only when no live or cached data is available) ───────── */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
let DEMO = null;
function buildDemo() {
  const N = 262, M = 78, dayKey = Math.floor(Date.now() / 864e5);
  if (DEMO && DEMO.dayKey === dayKey) return DEMO;
  const series = (key, sd, drift) => { const r = rng(hash(key)), a = []; for (let i = 0; i < N; i++) a.push(gauss(r) * sd + (drift || 0)); a.push(gauss(rng(hash(key + dayKey))) * sd); return a; };
  const mkt = series('mkt', 0.008, 0.0003), sec = {};
  SECTORS.forEach(s => sec[s.id] = series('sec' + s.id, 0.004));
  const base = {'^GSPC':7500, '^DJI':48000, '^IXIC':25000, '^RUT':2600, '^VIX':17};
  const out = {dayKey, M, sym:{}};
  const now = Math.floor(Date.now() / 1000), open = now - 3 * 3600;
  for (const sym of ALL_SYMBOLS) {
    const info = INFO[sym], r = rng(hash(sym)), rt = rng(hash(sym + dayKey));
    const kind = info.kind;
    const beta = kind === 'stock' ? 0.6 + r() * 0.9 : sym === '^VIX' ? 0 : sym === '^IXIC' ? 1.2 : sym === '^RUT' ? 1.15 : 1;
    const idio = kind === 'stock' ? 0.007 + r() * 0.013 : sym === '^VIX' ? 0.03 : 0.0015;
    const drift = kind === 'stock' ? (r() - 0.5) * 0.0012 : 0;
    const p0 = base[sym] || (kind === 'etf' ? 40 + r() * 180 : 35 + Math.pow(r(), 2) * 700);
    const secv = info.sector ? sec[info.sector.id] : null;
    const rets = [];
    for (let d = 0; d <= N; d++) rets.push(beta * mkt[d] + (secv ? secv[d] : 0) + idio * gauss(d < N ? r : rt) + drift);
    if (kind === 'stock' && rt() < 0.14) rets[N] += (rt() < 0.5 ? -1 : 1) * (0.03 + rt() * 0.045);   // a few outsized movers each day
    const c = [], t = []; let p = p0;
    for (let d = 0; d < N; d++) { p *= Math.exp(rets[d]); c.push(+p.toFixed(2)); t.push(open - (N - d) * 86400); }
    if (sym === '^VIX') {   // fear gauge: mean-reverting, moves against the market
      const lvl = d => { let m5 = 0; for (let j = Math.max(0, d - 4); j <= d; j++) m5 += mkt[j]; return 17 * Math.exp(-9 * m5); };
      for (let d = 0; d < N; d++) c[d] = +(lvl(d) * Math.exp(rets[d] * 0.5)).toFixed(2);
      rets[N] = Math.log(lvl(N) / c[N - 1]) + rets[N] * 0.5;
    }
    const prev = c[N - 1], path = []; let w = 0; const steps = [];
    for (let j = 0; j < M; j++) { w += gauss(rt) * idio * 1.1 / Math.sqrt(M); steps.push(w); }
    for (let j = 0; j < M; j++) { const f = (j + 1) / M; path.push(+(prev * Math.exp(rets[N] * f + steps[j] - f * steps[M - 1])).toFixed(2)); }
    out.sym[sym] = {c, t, prev, path, vol: Math.round((2 + r() * 60) * 1e6)};
  }
  return (DEMO = out);
}
function demoSpark(range) {
  const D = buildDemo(), now = Math.floor(Date.now() / 1000), open = now - 3 * 3600;
  const k = 18 + Math.floor(Date.now() / 5000) % (D.M - 18);
  return (range === '2y' ? LONG_SYMBOLS : ALL_SYMBOLS).map(sym => {
    const d = D.sym[sym];
    if (range === '2y') {   // 104 weekly closes ending at the latest daily close
      const r = rng(hash('wk' + sym)), sd = INFO[sym].kind === 'index' ? 0.018 : 0.026, w = [d.prev], t = [now];
      for (let i = 1; i < 104; i++) { w.unshift(+(w[0] / Math.exp(gauss(r) * sd + 0.0015)).toFixed(2)); t.unshift(now - i * 604800); }
      return {symbol: sym, response: [{meta: {symbol: sym, regularMarketTime: now, gmtoffset: -18000}, timestamp: t, indicators: {quote: [{close: w}]}}]};
    }
    if (range !== '1d') return {symbol: sym, response: [{meta: {symbol: sym, regularMarketTime: now, gmtoffset: -18000}, timestamp: d.t, indicators: {quote: [{close: d.c}]}}]};
    const seen = d.path.slice(0, k + 1), yr = d.c.concat(seen);
    return {symbol: sym, response: [{
      meta: {symbol: sym, regularMarketPrice: seen[k], previousClose: d.prev, chartPreviousClose: d.prev,
        regularMarketDayHigh: Math.max.apply(null, seen), regularMarketDayLow: Math.min.apply(null, seen),
        regularMarketVolume: INFO[sym].kind === 'index' ? null : Math.round(d.vol * (k + 1) / D.M),
        fiftyTwoWeekHigh: Math.max.apply(null, yr), fiftyTwoWeekLow: Math.min.apply(null, yr),
        regularMarketTime: now, gmtoffset: -18000,
        currentTradingPeriod: {pre: {start: open - 19800, end: open}, regular: {start: open, end: open + 23400}, post: {start: open + 23400, end: open + 37800}}},
      timestamp: seen.map((_, i) => open + i * 300), indicators: {quote: [{close: seen}]},
    }]};
  });
}

/* ───────── refresh loop ───────── */
async function refresh(manual) {

    <div class="srow s-head"><span>Sector</span><span>${rname} change</span><span class="num"></span><span class="num" title="Watched stocks in this sector that are up in the latest session">Up</span><span title="Speculative model lean for the sector ETF, next session">Next lean</span></div>
    ${rows.map(r => { const w = ok(r.v) ? (Math.abs(r.v) / maxAbs * 48).toFixed(1) : 0, best = r.mem[0], worst = r.mem[r.mem.length - 1];
      return `<div class="srow" data-sym="${esc(r.sec.etf)}" tabindex="0" title="${esc(r.sec.name)} (${esc(r.sec.etf)}): ${fmtPct(r.v)} over ${rname}"><span class="s-n"><b>${esc(r.sec.name)}</b><span>${best ? `Best ${esc(best.sym)} ${fmtPct(best.chg, 1)} · worst ${esc(worst.sym)} ${fmtPct(worst.chg, 1)}` : esc(r.sec.etf)}</span></span><span class="dbar">${ok(r.v) ? `<i class="${r.v >= 0 ? 'u' : 'dn'}" style="width:${w}%"></i>` : ''}</span><span class="num">${pctSpan(r.v)}</span><span class="num muted">${r.up}/${r.mem.length}</span><span>${leanChip(S.pred[r.sec.etf])}</span></div>`; }).join('')}
    </div>` + rotationCard();

  // predictions

  const m = S.market;

    ${picks.map(predCard).join('') || '<p class="hint" style="margin-top:10px">Per-stock reads need a year of price history, which has not loaded yet. They will appear on the next successful refresh.</p>'}</div></div>`;

  renderOutlook();
  renderScore();

  $('#a-foot').innerHTML = `Prices: Yahoo Finance (unofficial feed, may be delayed; index and ETF data included). Statistics are computed in this window from one year of daily closes: typical day = 30-session standard deviation of daily returns, RSI = 14-day Wilder, beta = 60 sessions vs the S&amp;P 500. Sector performance uses the SPDR sector ETFs. The sector outlook ranks those ETFs against the S&amp;P 500 using relative strength over 1, 3, 6 and 12 months, a 2-year reversal measure from weekly closes, trend, breadth, and volatility. The "lean" is a weighted blend of six simple price signals (trend, one-month momentum, RSI, size of latest move, sector and market backdrop), shown as a rough score and never as a guarantee. The scorecard compares each recorded lean with the next session's close and is kept only in this browser. <b>Nothing here is investment advice.</b>`;

      ${stat('Sessions scored', t.days)}

        ${recent.map(d => `<tr><td>${scoreDay(d.d)}</td><td class="num">${of(d.hit, d.n)}</td><td class="num">${ratePct(d.hit, d.n)}</td><td class="l">${mk(d)}</td></tr>`).join('')}</tbody></table>${wait}</div>

      <li>${t.days < 20 ? `It is too early to judge. ${t.days} session${t.days > 1 ? 's are' : ' is'} a small sample, and a hit rate this far from 50% can easily be luck.` : `Even ${t.days} sessions is a modest sample. Markets change character, and a rule that worked in one stretch often stops working in the next.`}</li>

function drawChart(el, st) {
  const c = st.series, T = st.seriesT, n = c.length;
  if (n < 3) { el.innerHTML = '<p class="hint">Price history is not available right now.</p>'; return; }
  const W = Math.max(320, el.clientWidth), H = 250, L = 4, R = 52, Tp = 8, B = 20;
  const maOf = k => c.map((_, i) => i >= k - 1 ? mean(c.slice(i - k + 1, i + 1)) : null);
  const m50 = n >= 50 ? maOf(50) : null, m200 = n >= 200 ? maOf(200) : null;
  let lo = Math.min.apply(null, c), hi = Math.max.apply(null, c);
  const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const x = i => L + i / (n - 1) * (W - L - R), y = v => Tp + (1 - (v - lo) / (hi - lo)) * (H - Tp - B);
  const path = a => { let d = '', pen = false; a.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; }); return d; };
  const step = (() => { const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag; })();
  let grid = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${W - R + 6}" y="${(y(v) + 3.5).toFixed(1)}">${v >= 1000 ? Math.round(v).toLocaleString('en-US') : +v.toFixed(2)}</text>`;
  let xt = '', lastM = -1, lastX = -99;
  T.forEach((t, i) => { const d = new Date(t * 1000), m = d.getMonth(); if (m !== lastM) { if (lastM !== -1 && x(i) - lastX > 46 && x(i) < W - R - 20) { xt += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 5}">${d.toLocaleDateString('en-US', {month:'short'})}${m === 0 ? " '" + String(d.getFullYear()).slice(2) : ''}</text>`; lastX = x(i); } lastM = m; } });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="One-year price chart for ${esc(st.sym)}">${grid}${xt}
    <path class="area" d="${path(c)}L${x(n - 1).toFixed(1)} ${H - B}L${x(0).toFixed(1)} ${H - B}Z"/>
    ${m200 ? `<path class="ln l3" d="${path(m200)}"/>` : ''}${m50 ? `<path class="ln l2" d="${path(m50)}"/>` : ''}<path class="ln l1" d="${path(c)}"/>
    <circle class="dot" cx="${x(n - 1).toFixed(1)}" cy="${y(c[n - 1]).toFixed(1)}" r="4" fill="var(--s1)"/>
    <g id="xh" visibility="hidden"><line class="ch" y1="${Tp}" y2="${H - B}"/><circle class="dot" r="4" fill="var(--s1)"/></g>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/></svg>`;
  const tip = $('#tip'), xh = $('#xh', el), hit = $('#hit', el);
  const move = ev => {
    const r = hit.getBoundingClientRect(), i = clamp(Math.round((ev.clientX - r.left) / r.width * (n - 1)), 0, n - 1);
    xh.setAttribute('visibility', 'visible');
    xh.firstElementChild.setAttribute('x1', x(i)); xh.firstElementChild.setAttribute('x2', x(i));
    xh.lastElementChild.setAttribute('cx', x(i)); xh.lastElementChild.setAttribute('cy', y(c[i]));
    const d = new Date(T[i] * 1000);
    tip.innerHTML = `<div class="muted">${d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'})}</div><div class="r"><span><i style="background:var(--s1)"></i>Close</span><b>${fmtP(c[i])}</b></div>${m50 && m50[i] != null ? `<div class="r"><span><i style="background:var(--s2)"></i>50-day</span><b>${fmtP(m50[i])}</b></div>` : ''}${m200 && m200[i] != null ? `<div class="r"><span><i style="background:var(--s3)"></i>200-day</span><b>${fmtP(m200[i])}</b></div>` : ''}`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(ev.clientX + 14, 4, innerWidth - tw - 4) + 'px'; tip.style.top = clamp(ev.clientY - th - 10, 4, innerHeight - th - 4) + 'px';
  };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', () => { xh.setAttribute('visibility', 'hidden'); tip.hidden = true; });
}

/* ───────── Windows host window (window.ps1): no native title bar, so the page draws its own controls ─────────
   Inside it, the page talks to the window through chrome.webview. In a normal browser none of this is active.
   Press and drag the ticker header, the thin bar, or the analysis header to move the window.
   A plain click on the thin bar (or the header's empty space) throws the window to the top or bottom screen edge. */
const HOST = (window.chrome && window.chrome.webview) || null;
const hostSend = msg => { try { HOST.postMessage(msg); } catch (e) { /* not in the host window */ } };
if (HOST) document.documentElement.classList.add('in-host');
const isThin = () => innerHeight <= 69;
let press = null;
document.addEventListener('pointerdown', ev => {
  S.eatClick = false; press = null;
  if (!HOST || ev.button !== 0 || document.fullscreenElement) return;
  const zone = ev.target.closest('.t-head,.tape,.a-head');
  if (!zone) return;
  const onTape = zone.classList.contains('tape'), thin = isThin();
  if (onTape && !thin) return;                                         // taller ticker: stocks on the tape stay clickable
  if (!onTape && ev.target.closest('button,a,input,select')) return;  // controls keep working
  press = {x: ev.screenX, y: ev.screenY, throwable: !zone.classList.contains('a-head')};
});
document.addEventListener('pointermove', ev => {
  if (press && Math.abs(ev.screenX - press.x) + Math.abs(ev.screenY - press.y) > 4) { press = null; S.eatClick = true; hostSend('drag'); }
});
document.addEventListener('pointerup', () => {
  if (!press) return;
  const p = press; press = null;
  if (p.throwable) { S.eatClick = true; hostSend('throw'); }
});
document.addEventListener('dblclick', ev => { if (HOST && ev.target.closest('.a-head') && !ev.target.closest('button')) hostSend('maximize'); });

/* ───────── mode switching: small window = ticker, full screen or large window = analysis ───────── */
const isBig = () => innerWidth >= 760 && innerHeight >= 440;
const currentMode = () => S.force || ((document.fullscreenElement || isBig()) ? 'analysis' : 'ticker');
function applyMode() {
  const m = currentMode();
  if (document.body.className !== 'mode-' + m) {
    document.body.className = 'mode-' + m;
    if (m === 'ticker') { S.selected = null; $('#modal').hidden = true; $('#tip').hidden = true; }
    if (Object.keys(S.stats).length) render();
  }
}
function expand(sym) {
  if (sym) S.selected = sym;
  S.force = null;
  const done = () => { if (currentMode() !== 'analysis') S.force = 'analysis'; applyMode(); if (S.selected) renderDetail(); };
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(done, done); else done();
}
function collapse() {
  S.force = null;
  if (document.fullscreenElement) { document.exitFullscreen().then(applyMode, applyMode); return; }
  if (HOST) hostSend('compact');
  else try { window.resizeTo(680, 170); } catch (e) { /* not allowed in a normal browser tab */ }
  setTimeout(() => { if (isBig()) S.force = 'ticker'; applyMode(); }, 200);
}
function render() {
  const m = currentMode();
  if (m === 'ticker') renderTicker(); else { renderAnalysis(); if (S.selected) renderDetail(); }
  const sp = S.stats['^GSPC'];
  document.title = (sp && ok(sp.chg) ? `S&P ${ARW[dirOf(sp.chg)]}${Math.abs(sp.chg * 100).toFixed(2)}% · ` : '') + 'Ticker' + (S.source === 'demo' ? ' (demo)' : '');
}

/* ───────── events ───────── */
document.addEventListener('click', ev => {
  if (S.eatClick) { S.eatClick = false; return; }   // this click was a throw or the end of a window drag
  const act = ev.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'expand') expand();
    else if (a === 'throw' || a === 'minimize' || a === 'quit') hostSend(a);
    else if (a === 'collapse') collapse();
    else if (a === 'refresh') refresh(true);
    else if (a === 'close') { S.selected = null; renderDetail(); }
    else if (a === 'range') { S.sectorRange = act.dataset.k; renderAnalysis(); }
    else if (a === 'score-clear') { if (Date.now() - S.scoreAsk < 6000) { S.score = {v: 1, open: {}, days: []}; S.scoreAsk = 0; scoreSave(); renderAnalysis(); } else { S.scoreAsk = Date.now(); renderScore(); } }
    else if (a === 'sort') { const k = act.dataset.k; S.sort = {key: k, dir: S.sort.key === k ? -S.sort.dir : (k === 'sym' || k === 'sector' ? 1 : -1)}; renderFull(); }
    return;
  }
  if (ev.target.id === 'modal') { S.selected = null; renderDetail(); return; }
  const s = ev.target.closest('[data-sym]');
  if (s) { if (currentMode() === 'ticker') expand(s.dataset.sym); else { S.selected = s.dataset.sym; renderDetail(); } }
});
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,textarea') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'Escape') { if (S.selected) { S.selected = null; renderDetail(); } else if (currentMode() === 'analysis' && !document.fullscreenElement) collapse(); }
  else if (ev.key === 'f' || ev.key === 'F') { currentMode() === 'ticker' ? expand() : collapse(); }
  else if (ev.key === 'r' || ev.key === 'R') refresh(true);
  else if ((ev.key === 't' || ev.key === 'T') && HOST && currentMode() === 'ticker') hostSend('throw');
  else if (ev.key === 'Enter') { const s = ev.target.closest && ev.target.closest('tr[data-sym],.srow[data-sym]'); if (s) { S.selected = s.dataset.sym; renderDetail(); } }
});
let rz = 0;
addEventListener('resize', () => { if (S.force === 'ticker' && !isBig()) S.force = null; if (S.force === 'analysis' && isBig()) S.force = null; applyMode(); clearTimeout(rz); rz = setTimeout(() => { if (S.selected && currentMode() === 'analysis') renderDetail(); }, 150); });
document.addEventListener('fullscreenchange', () => { S.force = null; applyMode(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.nextAt && Date.now() > S.nextAt) refresh(); });
// tells the local server this window is still open, so it can shut itself down after the window closes
if (location.protocol !== 'file:' && !PARAMS.get('api')) setInterval(() => { fetch(API + '/ping', {cache: 'no-store'}).catch(() => {}); }, 20000);

applyMode();
refresh();
</script>
</body>
</html>
